<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f1dfbd">
  <meta name="description" content="Merrythought — a center for the arts in Tivoli, New York. Theater, education, and hospitality.">
  <title>Merrythought — Center for the Arts in Tivoli, New York</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body data-page="home">
  <div class="site-shell">
    <header class="brand" aria-label="Merrythought">
      <a href="#home" class="brand-link" id="home-link" aria-label="Merrythought home">
        <img class="sun" src="assets/sun.png" alt="" aria-hidden="true">
        <img class="wordmark" src="assets/logo.png" alt="Merrythought">
      </a>
    </header>

    <p class="tagline">CENTER FOR THE ARTS <span>IN TIVOLI, NEW YORK</span></p>

    <main class="main-content" id="main-content">
      <nav class="primary-navigation" aria-label="Main navigation">
        <button class="nav-label label-vision" data-target="vision" aria-haspopup="dialog">VISION</button>
        <button class="nav-label label-involved" data-target="involved">HOW TO GET INVOLVED</button>
        <button class="nav-label label-events" data-target="events">EVENTS</button>
      </nav>
      <div class="involved-links" id="involved-links" aria-label="Ways to get involved">
        <a class="arrow-link" href="https://buy.stripe.com/bJe3co0ce7zk6us2EZfYY00"><img src="assets/pointer2.png" alt="" aria-hidden="true"><span>DONATE</span></a>
        <a class="arrow-link" href="mailto:info@merrythought.info"><img src="assets/pointer2.png" alt="" aria-hidden="true"><span>CONTACT US</span></a>
      </div>
      <div class="events-note" id="events-note" aria-live="polite">
        <p>UPCOMING EVENTS WILL BE ANNOUNCED HERE.</p>
        <a href="mailto:info@merrythought.info?subject=Merrythought%20Events">GET IN TOUCH</a>
      </div>
    </main>
    <footer class="footer-nav" aria-label="Page navigation">
      <button type="button" data-target="home" class="footer-home">MERRYTHOUGHT</button>
      <span>THEATER <i>·</i> EDUCATION <i>·</i> HOSPITALITY</span>
    </footer>
  </div>

  <div class="modal" id="vision-modal" role="dialog" aria-modal="true" aria-labelledby="vision-title" aria-hidden="true" tabindex="-1">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-inner">
      <div class="modal-topbar">
        <h1 id="vision-title">VISION</h1>
        <div class="modal-actions">
          <a href="assets/Merrythought-Vision.pdf" target="_blank" rel="noopener noreferrer" aria-label="Open vision PDF in a new tab">OPEN PDF <span aria-hidden="true">↗</span></a>
          <button type="button" id="close-vision" class="close-button" aria-label="Close vision PDF">×</button>
        </div>
      </div>
      <div class="viewer-row">
        <button type="button" class="page-arrow arrow-prev" id="prev-page" aria-label="Previous page"><span></span></button>
        <div class="pdf-frame" id="pdf-frame"><img id="pdf-viewer" alt="Merrythought vision presentation, page 1 of 12" src="assets/pages/vision-01.webp" width="1920" height="1080"></div>
        <button type="button" class="page-arrow arrow-next" id="next-page" aria-label="Next page"><span></span></button>
      </div>
      <div class="page-controls"><span id="page-status">01 / 12</span><span class="page-instruction">USE ARROWS TO EXPLORE</span></div>
    </div>
  </div>
</body>
</html>
